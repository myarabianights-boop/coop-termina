<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Room Prototype - City generator</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Bump SCRIPT_VERSION after changing any JS file to avoid stale browser copies. */
const SCRIPT_VERSION = '2';
(function loadScripts() {
  const files = [
    'engine', 'generation', 'graphics', 'structures', 'input', 'main'
  ];
  let failed = false;
  for (const name of files) {
    const s = document.createElement('script');
    s.src = `js/${name}.js?v=${SCRIPT_VERSION}`;
    s.async = false;
    s.onerror = () => {
      console.error(`[startup] could not load js/${name}.js - check exact filename capitalization`);
      if (failed) return;
      failed = true;
      const d = document.createElement('pre');
      d.style.cssText = 'position:fixed;left:0;top:0;margin:0;padding:24px;color:#ff6b6b;font:16px monospace;white-space:pre-wrap';
      d.textContent = `The game could not start: js/${name}.js failed to load.\n\nCheck that the file exists with exactly this capitalization, then reload.\nOpen the browser console (F12) for details.`;
      document.body.appendChild(d);
    };
    document.body.appendChild(s);
  }
})();
</script>
</body>
</html>
