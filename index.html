<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Room Prototype - City generator</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ============ CONFIG ============ */
const COLS = 40, ROWS = 40;          // tiles per room (generation grid only)
const TILE = 96;                     // pixels per tile (atlas tiles are 48px, so this is an exact 2x)
const CHAR = { w: 150, h: 200 };     // sprite size (placeholder)
const HIT  = { w: 75,  h: 100 };     // hitbox, at the character's feet
const SPEED = 450;                   // pixels per second
const NATIVE = 48;                   // the cached room background is drawn at the atlas' native tile size
const DOOR = 4;                      // exit width in tiles
const EDGE_LANE = 0;                 // city: width of the street lane between the border wall and the blocks (0 = blocks can touch the wall)
const EXIT_DEPTH = 3;                // tiles kept clear in front of every exit
const EXIT_MARGIN = 5;               // exits stay this many tiles away from the room corners

const EMPTY = 0, FULL = 1, EXIT = 2; // tile values
const D4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const idx = (x, y) => y * COLS + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;

/* ============ SEEDED RANDOM ============ */
let worldSeed = (Math.random() * 2 ** 32) >>> 0;
function hash(...nums) {
  let h = 2166136261;
  for (const v of nums) { h ^= v | 0; h = Math.imul(h, 16777619); h ^= h >>> 13; h = Math.imul(h, 0x85ebca6b); }
  return (h ^ (h >>> 16)) >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============ EXITS ============
   An exit is a strip of EXIT tiles in the border. Walking onto it warps you to another room.
   edge: 0 top, 1 bottom, 2 left, 3 right.  start: first tile along that edge. */
function doorCell(e, i) {
  switch (e.edge) { case 0: return [e.start + i, 0]; case 1: return [e.start + i, ROWS - 1];
                    case 2: return [0, e.start + i]; default: return [COLS - 1, e.start + i]; }
}
function inCell(e, i, d) {           // tile i along the exit, d tiles inward
  switch (e.edge) { case 0: return [e.start + i, d]; case 1: return [e.start + i, ROWS - 1 - d];
                    case 2: return [d, e.start + i]; default: return [COLS - 1 - d, e.start + i]; }
}
function spawnPos(e) {               // where you appear when arriving through this exit
  const c = e.start + DOOR / 2, d = 2.5; let tx, ty;
  switch (e.edge) { case 0: tx = c; ty = d; break; case 1: tx = c; ty = ROWS - d; break;
                    case 2: tx = d; ty = c; break; default: tx = COLS - d; ty = c; }
  return { x: tx * TILE, y: ty * TILE + HIT.h / 2 };
}
/* Each wall belongs to a direction. A room has 2 to 4 exits, never more than one per wall.
   Leaving through the north wall puts you at the SOUTH exit of the next room (and so on), at the same position along the wall.
   'back' = { edge, start }: the exit that must exist because it leads back to the room we came from. */
const DIRS = ['north', 'south', 'west', 'east'];       // index = edge: 0 top, 1 bottom, 2 left, 3 right
const OPPOSITE = [1, 0, 3, 2];
function placeExits(rng, back = null) {
  const n = 2 + Math.floor(rng() * 3), walls = [0, 1, 2, 3];
  for (let i = 3; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [walls[i], walls[j]] = [walls[j], walls[i]]; }
  const chosen = (back ? [back.edge, ...walls.filter(w => w !== back.edge)] : walls).slice(0, n);
  return chosen.map(edge => {
    const len = edge < 2 ? COLS : ROWS, lo = EXIT_MARGIN, hi = len - EXIT_MARGIN - DOOR;
    const start = back && edge === back.edge ? back.start : lo + Math.floor(rng() * (hi - lo + 1));
    return { edge, dir: DIRS[edge], start, to: null, toExit: 0 };
  }).sort((x, y) => x.edge - y.edge);                  // exits are listed north, south, west, east
}

/* ============ SHARED TOOLS ============ */
function label(g) {                  // connected components of FULL tiles ("isles")
  const lab = new Uint16Array(COLS * ROWS), sizes = [0]; let n = 0;
  for (let s = 0; s < g.length; s++) {
    if (g[s] !== FULL || lab[s]) continue;
    n++; let size = 0; const st = [s]; lab[s] = n;
    while (st.length) {
      const c = st.pop(); size++; const x = c % COLS, y = (c / COLS) | 0;
      for (const [dx, dy] of D4) {
        const nx = x + dx, ny = y + dy; if (!inb(nx, ny)) continue;
        const ni = idx(nx, ny); if (g[ni] === FULL && !lab[ni]) { lab[ni] = n; st.push(ni); }
      }
    }
    sizes[n] = size;
  }
  return { lab, sizes };
}
/* Connectivity for a character at least 2 tiles wide (the hitbox needs more than one tile of height).
   A "window" is a 2x2 block of walkable tiles; the walker slides it around. Slits 1 tile wide are NOT connections. */
const wideOk = (g, x, y) => x >= 0 && y >= 0 && x + 1 < COLS && y + 1 < ROWS &&
  g[idx(x, y)] !== FULL && g[idx(x + 1, y)] !== FULL && g[idx(x, y + 1)] !== FULL && g[idx(x + 1, y + 1)] !== FULL;
function wideFlood(g, sx, sy, visited) {   // tiles reachable from the window at (sx, sy); 'visited' lets callers walk every region
  const seen = new Uint8Array(COLS * ROWS), vis = visited || new Uint8Array(COLS * ROWS);
  if (!wideOk(g, sx, sy)) return { seen, size: 0, x: sx, y: sy };
  const st = [idx(sx, sy)]; vis[st[0]] = 1; let size = 0;
  while (st.length) {
    const c = st.pop(), x = c % COLS, y = (c / COLS) | 0; size++;
    seen[c] = seen[c + 1] = seen[c + COLS] = seen[c + COLS + 1] = 1;
    for (const [dx, dy] of D4) {
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
      const ni = idx(nx, ny); if (!vis[ni] && wideOk(g, nx, ny)) { vis[ni] = 1; st.push(ni); }
    }
  }
  return { seen, size, x: sx, y: sy };
}
function mainRegion(g) {                   // the biggest area a 2-tile-wide walker can move around in = the street network
  const vis = new Uint8Array(COLS * ROWS); let best = null;
  for (let y = 0; y < ROWS - 1; y++) for (let x = 0; x < COLS - 1; x++) {
    if (vis[idx(x, y)] || !wideOk(g, x, y)) continue;
    const r = wideFlood(g, x, y, vis); if (!best || r.size > best.size) best = r;
  }
  return best;
}
function spread(g, seed) {                 // every walkable tile 4-connected to the seed tiles (1-wide dead ends included)
  const seen = Uint8Array.from(seed), st = [];
  for (let i = 0; i < seen.length; i++) if (seen[i]) st.push(i);
  while (st.length) {
    const c = st.pop(), x = c % COLS, y = (c / COLS) | 0;
    for (const [dx, dy] of D4) {
      const nx = x + dx, ny = y + dy; if (!inb(nx, ny)) continue;
      const ni = idx(nx, ny); if (!seen[ni] && g[ni] !== FULL) { seen[ni] = 1; st.push(ni); }
    }
  }
  return seen;
}
function carveTo(g, seen, sx, sy) {        // carve a 2-wide path from (sx,sy) to the nearest tile of 'seen'
  const par = new Int32Array(COLS * ROWS).fill(-2), q = [idx(sx, sy)]; par[q[0]] = -1; let found = -1;
  for (let h = 0; h < q.length; h++) {
    const c = q[h]; if (seen[c]) { found = c; break; }
    const x = c % COLS, y = (c / COLS) | 0;
    for (const [dx, dy] of D4) {
      const nx = x + dx, ny = y + dy;
      if (nx < 1 || ny < 1 || nx >= COLS - 1 || ny >= ROWS - 1) continue;
      const ni = idx(nx, ny); if (par[ni] !== -2) continue; par[ni] = c; q.push(ni);
    }
  }
  if (found < 0) return;
  const open = (x, y) => { if (x >= 1 && y >= 1 && x < COLS - 1 && y < ROWS - 1) g[idx(x, y)] = EMPTY; };
  for (let c = found; c !== -1; c = par[c]) {
    const x = c % COLS, y = (c / COLS) | 0;
    open(x, y); open(x + 1, y); open(x, y + 1); open(x + 1, y + 1);
  }
  const fx = found % COLS, fy = (found / COLS) | 0;   // widen the junction so the 2x2 walker can really pass
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) open(fx + dx, fy + dy);
}

/* Runs after ANY generator: stamps exits, makes every exit reachable from every other,
   fills closed-off pockets, labels isles (for texturing later). Streets may still dead-end. */
function finalize(room) {
  const g = room.grid, ex = room.exits;
  for (const e of ex) for (let i = 0; i < DOOR; i++) {
    const [dx, dy] = doorCell(e, i); g[idx(dx, dy)] = EXIT;
    for (let d = 1; d <= EXIT_DEPTH; d++) { const [x, y] = inCell(e, i, d); g[idx(x, y)] = EMPTY; }   // clear approach in front of the exit
  }
  const st = e => inCell(e, DOOR >> 1, 2);
  let main = mainRegion(g);                                    // the street network
  for (const e of ex) {                                        // every exit must be connected to it, for a 2-wide walker
    for (let tries = 0; tries < 4; tries++) {
      const [x, y] = st(e); if (main.seen[idx(x, y)]) break;
      carveTo(g, main.seen, x, y); main = wideFlood(g, main.x, main.y);
    }
  }
  const reached = spread(g, main.seen);
  for (let i = 0; i < g.length; i++) if (g[i] !== FULL && !reached[i]) g[i] = FULL;   // closed pockets
  room.lab = label(g).lab;
  room.exitAt = new Map();
  ex.forEach((e, k) => { for (let i = 0; i < DOOR; i++) { const [x, y] = doorCell(e, i); room.exitAt.set(idx(x, y), k); } });
}

/* ============ CITY GENERATOR ============
   1. street lane around the edge  2. scatter block centers (min distance apart)
   3. every tile goes to its nearest center; tiles close to a block boundary become street
      (this gives wide, irregular, diagonal streets)
   4. some neighbor blocks merge (no street between them = big/stacked buildings), some become plazas
   5. chamfer corners for variety, delete tiny leftover isles */
function genCity(rng) {
  const g = new Uint8Array(COLS * ROWS).fill(FULL);
  const minD = 12 + rng() * 2, half = 1.5 + rng() * 0.6;     // block spacing; half street width
  const lo = EDGE_LANE + 3, pts = [];
  for (let t = 0; t < 600 && pts.length < 80; t++) {
    const x = lo + rng() * (COLS - 2 * lo), y = lo + rng() * (ROWS - 2 * lo);
    if (pts.every(q => Math.hypot(q.x - x, q.y - y) >= minD)) pts.push({ x, y });
  }
  const par = pts.map((_, i) => i), find = i => par[i] === i ? i : (par[i] = find(par[i]));
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++)
    if (Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y) < minD * 1.6 && rng() < 0.4) par[find(i)] = find(j);
  const root = pts.map((_, i) => find(i)), plaza = new Set();
  for (let i = 0; i < pts.length; i++) if (root[i] === i && rng() < 0.12) plaza.add(i);

  const ds = new Float64Array(pts.length);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const m = Math.min(x, y, COLS - 1 - x, ROWS - 1 - y);
    if (m === 0) continue;                                   // border stays full
    if (m <= EDGE_LANE) { g[idx(x, y)] = EMPTY; continue; }  // edge street lane (none when EDGE_LANE = 0)
    let d1 = Infinity, a = 0;
    for (let k = 0; k < pts.length; k++) {
      ds[k] = Math.hypot(pts[k].x - (x + .5), pts[k].y - (y + .5));
      if (ds[k] < d1) { d1 = ds[k]; a = k; }
    }
    let dO = Infinity;                                       // nearest block of a DIFFERENT group
    for (let k = 0; k < pts.length; k++) if (root[k] !== root[a] && ds[k] < dO) dO = ds[k];
    const street = (dO - d1) / 2 < half;
    g[idx(x, y)] = (street || plaza.has(root[a])) ? EMPTY : FULL;
  }

  for (let pass = 0; pass < 1; pass++) {                     // chamfer convex corners
    const rm = [];
    for (let y = EDGE_LANE + 1; y < ROWS - EDGE_LANE - 1; y++) for (let x = EDGE_LANE + 1; x < COLS - EDGE_LANE - 1; x++) {
      if (g[idx(x, y)] !== FULL) continue;
      const u = g[idx(x, y - 1)] === EMPTY, d = g[idx(x, y + 1)] === EMPTY;
      const l = g[idx(x - 1, y)] === EMPTY, r = g[idx(x + 1, y)] === EMPTY;
      if (((u && l) || (u && r) || (d && l) || (d && r)) && rng() < 0.5) rm.push(idx(x, y));
    }
    for (const i of rm) g[i] = EMPTY;
  }
  const L = label(g);                                        // drop tiny isles (not the border)
  for (let i = 0; i < g.length; i++)
    if (g[i] === FULL && L.lab[i] !== L.lab[0] && L.sizes[L.lab[i]] < 8) g[i] = EMPTY;
  return g;
}

/* ============ ASSET LOCATIONS (static hosting) ============
   Every path here is RELATIVE to the page, so it works on a GitHub Pages project site (https://USER.github.io/REPO/),
   on a local HTTP server, and in any subfolder. Never start a path with "/" (that points at the domain root).
   File names are CASE-SENSITIVE on GitHub Pages: they must match the files in the repo exactly. */
const APP_ID = 'coop-termina';                   // prefix for cache names (all projects of one github.io account share one browser origin)
const STRUCTURES_DIR = 'structures/';            // structure JSON files live here
const STRUCTURE_MANIFEST = 'manifest.json';      // structures/manifest.json = JSON array of the file names to load, e.g. ["structures.json"]
const STRUCTURE_FALLBACK_FILES = ['structures.json'];   // read (with a console warning) if the manifest is missing
const ATLAS_DIR = 'assets/';                     // atlas images live here; a structure's texture.atlas is the exact file name
const ASSET_VERSION = '2';                       // BUMP after changing any atlas or structure file: it renames the caches and is added to atlas URLs (?v=)
const STRUCTURE_CACHE_MINUTES = 10;              // saved structures are reused this long before the files are requested again
const DOT_MUST_BE_EMPTY = false;                  // false: '.' = "not part of the structure", no constraint on the map

/* Caching is ON for visitors and OFF on localhost / file:// (so edits show up immediately while developing).
   ?nocache forces it off, ?usecache forces it on (to test it locally). */
const PARAMS = new URLSearchParams(location.search);
const IS_LOCAL = ['localhost', '127.0.0.1', '[::1]', ''].includes(location.hostname);
const USE_CACHE = !PARAMS.has('nocache') && (PARAMS.has('usecache') || !IS_LOCAL);
const PAGE_BASE = new URL('./', document.baseURI).href;                 // folder of the page, whatever it is called
const assetUrl = path => new URL(path, PAGE_BASE).href;
const safeName = n => typeof n === 'string' && n !== '' && !n.startsWith('/') && !n.includes('..') && !n.includes('\\') && !/^[a-z][a-z0-9+.-]*:/i.test(n);
const encodePath = n => n.split('/').map(encodeURIComponent).join('/');
const ATLAS_CACHE_NAME = `${APP_ID}-atlas-v${ASSET_VERSION}`, STRUCT_CACHE_KEY = `${APP_ID}-structures-v${ASSET_VERSION}`;
const LEGACY_CACHES = ['city-atlas-cache-v1'], LEGACY_KEYS = ['termina-structures-v1'];

let STRUCT_LIST = [], structSource = '', structWarnings = [];

const atlases = {};
const isBorder = (x, y) => x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1;

/* Turns a definition into placeable variants (normal + mirrored). Mirroring flips the footprint,
   the anchor and every texture tile's 'at' across the same vertical axis, and flags tiles to be drawn flipped. */
function compileStructure(def) {
  const rows = def.footprint, tiles = def.texture.tiles, ts = def.texture.tileSize;
  const anchor = def.anchor || [0, 0];
  const W = Math.max(...rows.map(r => r.length), ...tiles.map(t => t.at[0] + 1));
  const H = Math.max(rows.length, ...tiles.map(t => t.at[1] + 1));
  const base = rows.map(r => r.padEnd(W, '.')); while (base.length < H) base.push('.'.repeat(W));
  const mk = m => ({
    id: def.id, atlas: def.texture.atlas, tileSize: ts, flip: m, w: W, h: H,
    fp: m ? base.map(r => [...r].reverse().join('')) : base,
    anchor: m ? [W - 1 - anchor[0], anchor[1]] : [...anchor],
    tiles: tiles.map(t => ({ src: t.src, at: m ? [W - 1 - t.at[0], t.at[1]] : t.at })),
  });
  const occ = new Set(), warn = [];
  base.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === '#' || ch === 'D') occ.add(x + ',' + y); }));
  const texAt = new Set(tiles.map(t => t.at[0] + ',' + t.at[1]));
  const over = tiles.filter(t => !occ.has(t.at[0] + ',' + t.at[1])).length;
  if (over) warn.push(`${def.id}: ${over} texture tile(s) lie outside the footprint (fine if they are visual overhangs)`);
  for (const k of occ) if (!texAt.has(k)) warn.push(`${def.id}: footprint cell (${k}) has no texture tile`);
  const variants = [mk(false)]; if (def.mirror) variants.push(mk(true));   // note: 'rotation' is not implemented yet
  let baseRow = 0; base.forEach((r, y) => { if (/[#D]/.test(r)) baseRow = y + 1; });   // last occupied row: used to order overlapping structures
  variants.forEach(v => {
    v.baseRow = baseRow;
    const xs = v.tiles.map(t => t.at[0]), ys = v.tiles.map(t => t.at[1]);
    v.box = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];   // sprite extent in tiles
    const fr = v.fp.findIndex(r => /[#D]/.test(r));                       // first occupied cell in reading order = scan point,
    v.first = [v.fp[fr].search(/[#D]/), fr];                              // so structures with empty top rows aren't favored
  });
  const weight = Number.isFinite(def.weight) ? def.weight : 1;                // missing weight = 1, 0 or less = never placed
  const priority = Number.isFinite(def.priority) ? def.priority : 1;          // pass number: 1 is placed first; missing = 1
  return { id: def.id, area: occ.size, weight, priority, variants, warn };
}

/* ---- Atlas images: Cache API (visitors only) -> network. One download per atlas, decoded once. ---- */
async function openAtlasCache() {
  if (!USE_CACHE || typeof caches === 'undefined') return null;          // Cache API needs https or localhost
  try { return await caches.open(ATLAS_CACHE_NAME); }
  catch (e) { console.warn('[atlas] Cache API unavailable, downloading on every visit:', e.message || e); return null; }
}
async function fetchAtlasBlob(url, skipCache) {
  const cache = await openAtlasCache();
  if (cache && !skipCache) { const hit = await cache.match(url); if (hit) return { blob: await hit.blob(), from: 'cache' }; }
  const res = await fetch(url, { cache: USE_CACHE ? 'default' : 'no-cache' });
  if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`.trim());
  const type = res.headers.get('content-type') || '';
  if (type && !/^image\//i.test(type)) throw new Error(`the server sent "${type}", not an image`);
  if (cache) { try { await cache.put(url, res.clone()); } catch (e) { console.warn('[atlas] could not save to cache:', e.message || e); } }
  return { blob: await res.blob(), from: 'network' };
}
function decodeImage(blob) {
  if (typeof createImageBitmap === 'function') return createImageBitmap(blob);
  return new Promise((res, rej) => {                                    // very old browsers
    const u = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('the image could not be decoded')); };
    im.src = u;
  });
}
const atlasJobs = {};
const loadAtlas = name => atlasJobs[name] || (atlasJobs[name] = loadAtlasOnce(name));
async function loadAtlasOnce(name) {
  const a = atlases[name] = { ok: false, img: null, status: 'loading', error: '', url: '' };
  try {
    if (!safeName(name)) throw new Error('the atlas must be a plain file name inside ' + ATLAS_DIR + ' (no leading "/", no "..", no http://)');
    const url = a.url = assetUrl(ATLAS_DIR + encodePath(name)) + '?v=' + encodeURIComponent(ASSET_VERSION);
    let got = await fetchAtlasBlob(url, false);
    try { a.img = await decodeImage(got.blob); }
    catch (e) {
      if (got.from !== 'cache') throw e;
      console.warn(`[atlas] the cached copy of "${name}" is damaged; downloading it again`);
      const cache = await openAtlasCache(); if (cache) await cache.delete(url);
      got = await fetchAtlasBlob(url, true); a.img = await decodeImage(got.blob);
    }
    a.ok = true; a.status = `loaded from ${got.from} (${a.img.width}x${a.img.height}px)`;
  } catch (e) {
    a.error = e.message || String(e); a.status = 'FAILED: ' + a.error;
    console.error(`[atlas] could not load "${name}"${a.url ? ' from ' + a.url : ''}\n  reason: ${a.error}\n` +
      `  check: the file exists as ${ATLAS_DIR}${name} in the repository with exactly this capitalization (GitHub Pages is case-sensitive), and Pages has finished deploying.`);
  }
}
/* "Tile calculations": assembles each variant's tiles into ONE sprite, once, at the atlas' native resolution.
   Drawing a placement is then a single drawImage. Mirrored variants get flipped tiles. */
function buildSprite(v, atlas) {
  const ts = v.tileSize, c = document.createElement('canvas');
  c.width = v.w * ts; c.height = v.h * ts;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  for (const t of v.tiles) {
    const sx = t.src[0] * ts, sy = t.src[1] * ts;
    if (v.flip) { g.save(); g.translate((t.at[0] + 1) * ts, t.at[1] * ts); g.scale(-1, 1); g.drawImage(atlas.img, sx, sy, ts, ts, 0, 0, ts, ts); g.restore(); }
    else g.drawImage(atlas.img, sx, sy, ts, ts, t.at[0] * ts, t.at[1] * ts, ts, ts);
  }
  return c;
}
/* ---- Structures: fresh cache -> structures/ folder (via manifest.json) -> stale cache. No built-in copy:
   if nothing loads, the game says so instead of quietly running with missing or outdated definitions. ---- */
const readStructCache = () => { try { return JSON.parse(localStorage.getItem(STRUCT_CACHE_KEY)); } catch (e) { return null; } };
const writeStructCache = o => { try { localStorage.setItem(STRUCT_CACHE_KEY, JSON.stringify(o)); } catch (e) { console.warn('[structures] could not save to localStorage:', e.message || e); } };
async function dropOldCaches() {                                        // remove what older ASSET_VERSIONs left behind
  try { if (typeof caches !== 'undefined') for (const k of await caches.keys())

    seen.add(d.id); defs.push(d);

function fits(g, claimed, v, ox, oy) {

    const ch = v.fp[r][c]; if (ch === '?') continue;
    const x = ox + c, y = oy + r;
    if (ch === '.') { if (DOT_MUST_BE_EMPTY && inb(x, y) && g[idx(x, y)] === FULL) return false; continue; }
    if (!inb(x, y) || isBorder(x, y)) return false;

/* Runs after finalize(). Structures are placed in PASSES, one per distinct "priority" value, lowest number first
   (priority 1 = first pass; a level nobody uses is simply skipped). Tiles claimed in one pass are closed to the next, so big
   buildings go down first and small ones only fill what is left.
   Within a pass the room is walked in reading order (top-left to bottom-right). At every free FULL tile, each structure of
   that pass whose FIRST occupied cell (top row, leftmost) could land there is checked; those that fit are the candidates.
   ONE is picked at random with probability proportional to its "weight", then one of its fitting variants (normal / mirrored).
   Weights only decide between structures of the same pass that fit at the same spot.
   room.struct[i] = placement number (0 = none). The anchor is stored but does not change the scan. */

  const g = room.grid, claimed = new Uint16Array(COLS * ROWS), placements = [];
  const levels = [...new Set(STRUCT_LIST.map(s => s.priority))].sort((a, b) => a - b);
  for (const level of levels) {
    const pool = STRUCT_LIST.filter(s => s.priority === level);
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const rPick = rng(), rVar = rng();                // exactly two rng calls per tile and pass keeps it deterministic
      const i0 = idx(x, y);

      const cands = []; let total = 0;
      for (const s of pool) {
        if (s.weight <= 0) continue;
        const fit = s.variants.filter(v => fits(g, claimed, v, x - v.first[0], y - v.first[1]));
        if (fit.length) { cands.push({ s, fit }); total += s.weight; }

      for (const c of cands) { r -= c.s.weight; if (r < 0) { chosen = c; break; } }
      const v = chosen.fit[Math.floor(rVar * chosen.fit.length)], ox = x - v.first[0], oy = y - v.first[1];

  ctx.imageSmoothingQuality = 'low';
  if (!useScaled) drawNative(curBg, camX, camY, VW, VH); // live path: one copy of the cached native background
  if (showGrid || showFootprint) { ctx.imageSmoothingEnabled = true; drawNative(getOverlay(cur), camX, camY, VW, VH); }
  ctx.fillStyle = '#e8923a';
  ctx.fillRect(p.x - CHAR.w / 2 - camX, p.y - CHAR.h - camY, CHAR.w, CHAR.h);
  if (showHit) {
    ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2 / zoom;
    ctx.strokeRect(p.x - HIT.w / 2 - camX, p.y - HIT.h - camY, HIT.w, HIT.h);
  }
  ctx.restore();

  ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
  ctx.fillText(`room ${cur.id}  type: ${cur.type}  exits: ${cur.exits.map(e => e.dir[0].toUpperCase()).join(' ')}  seed: ${worldSeed}  rooms loaded: ${rooms.size}`, 12, 24);
  ctx.fillText('WASD / arrows / numpad: move   G: grid   H: hitbox   M: minimap   F: footprint   R: new world   cyan tiles = exits', 12, 46);
  ctx.fillText(`zoom: ${zoom.toFixed(2)}   + / - or mouse wheel`, 12, 68);
  const counts = STRUCT_LIST.map(st => `${st.id} x${cur.placements.filter(q => q.id === st.id).length} (p${st.priority} w${st.weight})`).join('  ');
  ctx.fillText(`placed: ${counts}   leftover filled tiles: ${cur.leftover}   (blue = leftover; F = footprint)`, 12, 90);
  const atl = STRUCT_LIST.map(s => s.variants[0].atlas).filter((a, i, arr) => arr.indexOf(a) === i).map(a => `${a}: ${atlases[a] ? atlases[a].status : 'not loaded'}`).join(', ');
  ctx.fillText(`loaded: ${STRUCT_LIST.map(s => s.id).join(', ')} from ${structSource}   atlas ${atl}`, 12, 112);
  structWarnings.slice(0, 5).forEach((w, k) => { ctx.fillStyle = /^ERROR/.test(w) ? '#ff6b6b' : '#ffb347'; ctx.fillText('! ' + w, 12, 134 + k * 20); }); ctx.fillStyle = '#fff';

  if (showMini) {
    const size = 220, s = size / Math.max(COLS, ROWS), mx = W - size - 12, my = 12;
    if (!cur.mini) {
      cur.mini = document.createElement('canvas'); cur.mini.width = COLS; cur.mini.height = ROWS;
      const g = cur.mini.getContext('2d');
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        const v = cur.grid[idx(x, y)]; g.fillStyle = v === FULL ? (cur.struct[idx(x, y)] ? '#c8553d' : isBorder(x, y) ? '#667' : '#4f8fe0') : v === EXIT ? '#37d6e8' : '#222'; g.fillRect(x, y, 1, 1);
      }
    }
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(cur.mini, mx, my, COLS * s, ROWS * s);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(mx, my, COLS * s, ROWS * s);
    ctx.fillStyle = '#e8923a';
    ctx.fillRect(mx + (p.x / TILE) * s - 3, my + ((p.y - HIT.h / 2) / TILE) * s - 3, 6, 6);
  }

  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); fade = Math.max(0, fade - dt * 3); }
  if (!document.hasFocus()) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, H / 2 - 40, W, 80);
    ctx.fillStyle = '#fff'; ctx.font = '24px monospace'; ctx.textAlign = 'center';
    ctx.fillText('Click here to enable keyboard controls', W / 2, H / 2 + 8);
    ctx.textAlign = 'left';
  }
  if (FPS_COUNTER) {
    fps.frames++; fps.t += rawDt; fps.worst = Math.max(fps.worst, rawDt);
    const work = performance.now() - t0; fps.work += work; fps.workMax = Math.max(fps.workMax, work);
    if (fps.t >= 500) {
      fps.shown = `FPS ${(fps.frames * 1000 / fps.t).toFixed(0)}  |  JS draw ${(fps.work / fps.frames).toFixed(1)} ms avg, ${fps.workMax.toFixed(1)} ms max  |  slowest frame ${fps.worst.toFixed(0)} ms`;
      fps.frames = 0; fps.t = 0; fps.worst = 0; fps.work = 0; fps.workMax = 0;
    }
    ctx.font = '16px monospace'; ctx.fillStyle = '#7CFC00'; ctx.fillText(fps.shown, 12, canvas.height - 14);
  }
  requestAnimationFrame(frame);
}
ctx.fillStyle = '#fff'; ctx.font = '20px monospace'; ctx.fillText('Loading structures and atlas...', 20, 40);
loadStructures().then(() => { startWorld(); requestAnimationFrame(frame); }).catch(e => {
  console.error('[startup] the game could not start:', e);
  fatal = { title: 'The game could not start', lines: [
    ...String(e && e.message || e).split('\n').slice(0, 8),
    '', 'Open the browser console (F12) for details.',
    ...(location.protocol === 'file:' ? ['This page was opened as a file. Run a local server in the project folder', '(for example: python -m http.server) and open http://localhost:8000/ instead.'] : []),
  ] };
  drawFatal();
});
</script>
</body>
</html>
